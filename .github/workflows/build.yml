name: Build Dreamcast ELF

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential texinfo libjpeg-dev libpng-dev libelf-dev \
            git subversion python3 wget curl gettext bison flex libgmp-dev libmpfr-dev libmpc-dev cc65 \
            meson ninja-build pkg-config libisofs-dev

      - name: Clone KallistiOS and create environ.sh
        run: |
          sudo mkdir -p /opt/toolchains/dc
          sudo chown -R "$USER":"$USER" /opt/toolchains
          git clone --depth 1 https://github.com/KallistiOS/KallistiOS.git /opt/toolchains/dc/kos
          cp /opt/toolchains/dc/kos/doc/environ.sh.sample /opt/toolchains/dc/kos/environ.sh

      - name: Restore cached SH-4 toolchain
        id: tc
        uses: actions/cache/restore@v4
        with:
          path: /opt/toolchains/dc/sh-elf
          key: kos-sh-elf-stable-ubuntu24-v1

      - name: Build SH-4 toolchain (first run only, about an hour)
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          cd /opt/toolchains/dc/kos/utils/kos-chain
          cp Makefile.dreamcast.cfg Makefile.cfg
          sed -i "s/^makejobs=.*/makejobs=$(nproc)/" Makefile.cfg
          make

      - name: Save toolchain to cache
        if: steps.tc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/toolchains/dc/sh-elf
          key: kos-sh-elf-stable-ubuntu24-v1

      - name: Build KallistiOS
        run: |
          . /opt/toolchains/dc/kos/environ.sh
          cd "$KOS_BASE"
          make -j"$(nproc)"

      - name: Build Super Mario Bros. for Dreamcast
        env:
          SMB_ROM_GZ_B64: ${{ secrets.SMB_ROM_GZ_B64 }}
        run: |
          . /opt/toolchains/dc/kos/environ.sh
          if [ -n "$SMB_ROM_GZ_B64" ]; then
            echo "$SMB_ROM_GZ_B64" | base64 -d | gunzip > "Super Mario Bros. (World).nes"
            ./build.sh "Super Mario Bros. (World).nes"
            rm -f "Super Mario Bros. (World).nes"
          else
            echo "::warning::Secret SMB_ROM_GZ_B64 is not set - building without the game, the ELF will say smb.nes is missing"
            mkdir -p romdisk
            make
          fi

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: smb_dc_elf
          path: smb_dc.elf
          if-no-files-found: error

      - name: Build mkdcdisc
        continue-on-error: true
        run: |
          git clone --depth 1 https://gitlab.com/simulant/mkdcdisc.git "$HOME/mkdcdisc"
          cd "$HOME/mkdcdisc"
          meson setup builddir
          meson compile -C builddir
          ./builddir/mkdcdisc -h || true

      - name: Make CDI disc image
        continue-on-error: true
        run: |
          "$HOME/mkdcdisc/builddir/mkdcdisc" -e smb_dc.elf -o smb.cdi -n "SMB"
          ls -l smb.cdi

      - name: Upload CDI
        uses: actions/upload-artifact@v4
        with:
          name: smb_dc_cdi
          path: smb.cdi
          if-no-files-found: warn
