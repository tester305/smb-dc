name: Build Dreamcast ELF

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libelf-dev libpng-dev wget git texinfo bison flex libgmp3-dev libmpfr-dev libmpc-dev gettext zlib1g-dev

      - name: Setup KallistiOS & Toolchain
        run: |
          sudo mkdir -p /opt/toolchains
          sudo chown -R $USER:$USER /opt/toolchains
          git clone https://github.com/KallistiOS/KallistiOS.git $HOME/kos
          cd $HOME/kos
          
          # Doğrudan hatasız environ.sh dosyamızı yazıyoruz
          cat << 'EOT' > environ.sh
          export KOS_BASE="$HOME/kos"
          export KOS_PORTS="$HOME/kos/ports"
          export KOS_CC_BASE="/opt/toolchains/dc"
          export DC_ARCH="dreamcast"
          export DC_CVS_HOST="localhost"
          export DC_ARM_CC="none"
          . \$KOS_BASE/env/environ_base.sh
          EOT
          
          cd utils/kos-chain
          make

      - name: Build Super Mario Bros DC
        run: |
          export KOS_BASE="$HOME/kos"
          . $HOME/kos/environ.sh
          make

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smb_dc_elf
          path: smb_dc.elf
