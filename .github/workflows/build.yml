name: Build Dreamcast ELF

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libelf-dev libpng-dev wget git texinfo bison flex libgmp3-dev libmpfr-dev libmpc-dev gettext zlib1g-dev

      - name: Setup KallistiOS & Toolchain
        run: |
          git clone https://github.com/KallistiOS/KallistiOS.git $HOME/kos
          cd $HOME/kos
          cp doc/environ.sh.sample environ.sh
          echo "export KOS_BASE='$HOME/kos'" >> environ.sh
          echo "export KOS_PORTS='$HOME/kos/ports'" >> environ.sh
          echo "export DC_ARM_CC='none'" >> environ.sh
          
          cd utils/kos-chain
          make

      - name: Build Super Mario Bros DC
        run: |
          export KOS_BASE="$HOME/kos"
          . $HOME/kos/environ.sh
          make

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smb_dc_elf
          path: smb_dc.elf
